name: release

# Build the kine binary with the Dolt-backed beads driver natively on each
# target arch (no emulation — a big CGO/Dolt build segfaults under qemu) and
# publish a GitHub release. kine builds against upstream beads via a go.mod
# replace (../beads), so each job checks beads out as a sibling of kine.
#
# Cut a release:  git tag beads-v0.1.0 && git push origin beads-v0.1.0

on:
  push:
    tags:
      - 'beads-v*'

permissions:
  contents: write

env:
  # The github.com/steveyegge/beads commit go.mod's `replace` expects.
  BEADS_REF: 125c62063406d064d8392f3245920b47e9c81f85

jobs:
  build:
    name: build ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            asset: kine-beads-linux-amd64
          - runner: ubuntu-24.04-arm
            asset: kine-beads-linux-arm64
          - runner: macos-latest
            asset: kine-beads-darwin-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          path: kine
      - uses: actions/checkout@v4
        with:
          repository: gastownhall/beads
          ref: ${{ env.BEADS_REF }}
          path: beads          # sibling of kine/ → satisfies go.mod `replace => ../beads`
      - uses: actions/setup-go@v5
        with:
          go-version-file: kine/go.mod
      - name: build
        working-directory: kine
        run: |
          CGO_ENABLED=1 go build -tags gms_pure_go -o "${{ matrix.asset }}" .
          ls -la "${{ matrix.asset }}"
          file "${{ matrix.asset }}" || true
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: kine/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la dist
          gh release create "${{ github.ref_name }}" dist/* \
            --title "kine-beads ${{ github.ref_name }}" \
            --notes "kine with the Dolt-backed beads driver (k3s-on-beads).

          Binaries: linux/amd64, linux/arm64, darwin/arm64.
          Built \`CGO_ENABLED=1 go build -tags gms_pure_go\` against beads @ \`${{ env.BEADS_REF }}\`.

          Run as the k3s datastore:
          \`\`\`
          kine-beads --endpoint 'beads:///path/to/data?server=127.0.0.1:3307' --listen-address tcp://0.0.0.0:2379
          k3s server --datastore-endpoint=http://127.0.0.1:2379
          \`\`\`"
